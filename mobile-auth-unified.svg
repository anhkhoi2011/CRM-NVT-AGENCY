<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 840" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=Cinzel:wght@700;900&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      * { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .brand-title { font-family: 'Cinzel', serif; font-size: 17px; font-weight: 900; letter-spacing: 2px; fill: #0f172a; text-anchor: middle; }
      .slogan { font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 800; letter-spacing: 1.8px; fill: #ea580c; text-anchor: middle; }
      .hero-title { font-size: 15px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .hero-sub { font-size: 10px; font-weight: 500; fill: #64748b; letter-spacing: 0.2px; text-anchor: middle; text-transform: uppercase; }
      .input-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.6px; fill: #475569; }
      .placeholder { font-size: 12px; font-weight: 500; fill: #94a3b8; }
      .btn-text { font-size: 12px; font-weight: 800; letter-spacing: 1px; fill: #ffffff; text-anchor: middle; }
    </style>

    <radialGradient id="auraBg" cx="50%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#fafaf9" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="btnOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- NỀN CHUNG -->
  <rect width="880" height="840" fill="#f8fafc" />
  <rect width="880" height="840" fill="url(#auraBg)" />

  <!-- TIÊU ĐỀ SO SÁNH 2 TAB TRÊN MOBILE -->
  <text x="440" y="36" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">GIAO DIỆN HỢP NHẤT 2-TRONG-1 TRÊN MOBILE (NVT AGENCY CRM)</text>
  <text x="440" y="56" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Chuyển đổi mượt mà bằng thanh Tab trên đầu hoặc Link ở chân trang</text>

  <!-- ══════════════════════════════════════════════════════════════
       CỘT 1: TAB ĐĂNG NHẬP (ACTIVE)
       ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(45, 75)" filter="url(#cardShadow)">
    <rect width="375" height="725" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

    <!-- 1. THANH TAB CHUYỂN ĐỔI (SEGMENTED TABS) -->
    <g transform="translate(24, 20)">
      <rect width="327" height="40" rx="10" fill="#f1f5f9" />
      <!-- Tab Đăng nhập Active -->
      <rect x="3" y="3" width="160" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="83" y="24" font-size="11.5" font-weight="800" fill="#ea580c" text-anchor="middle">ĐĂNG NHẬP</text>
      <!-- Tab Đăng ký Inactive -->
      <text x="246" y="24" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">ĐĂNG KÝ</text>
    </g>

    <!-- 2. BRAND LOGO -->
    <g transform="translate(187, 85)">
      <rect x="-22" y="0" width="44" height="44" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" />
      <circle cx="0" cy="22" r="15" fill="#fff7ed" />
      <text x="0" y="26" font-size="12" font-weight="900" fill="#ea580c" text-anchor="middle">NVT</text>
      <text x="0" y="66" class="brand-title">NVT AGENCY</text>
      <text x="0" y="80" class="slogan">ACADEMY · AFFILIATE · EDUCATION</text>
      <text x="0" y="108" class="hero-title">ĐĂNG NHẬP NVT AGENCY</text>
      <text x="0" y="124" class="hero-sub">ĐĂNG NHẬP ĐỂ TRUY CẬP HỆ THỐNG NỘI BỘ.</text>
    </g>

    <!-- 3. INPUT FIELDS ĐĂNG NHẬP -->
    <g transform="translate(24, 235)">
      <!-- Số điện thoại hoặc Email -->
      <g transform="translate(0, 0)">
        <text x="0" y="10" class="input-label">SỐ ĐIỆN THOẠI HOẶC EMAIL</text>
        <rect x="0" y="16" width="327" height="46" rx="11" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="44" font-size="14">✉️</text>
        <text x="38" y="44" class="placeholder">Nhập số điện thoại hoặc email...</text>
      </g>

      <!-- Mật khẩu -->
      <g transform="translate(0, 80)">
        <text x="0" y="10" class="input-label">MẬT KHẨU</text>
        <rect x="0" y="16" width="327" height="46" rx="11" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
        <text x="14" y="44" font-size="14">🔒</text>
        <text x="38" y="44" font-size="14" fill="#0f172a" letter-spacing="2">••••••••</text>
        <text x="300" y="44" font-size="14">👁️</text>
      </g>

      <!-- Hàng Ghi nhớ & Quên mật khẩu (Chuẩn form 1 hàng) -->
      <g transform="translate(0, 156)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#ea580c" />
        <polyline points="4,8 7,11 12,4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="24" y="13" font-size="12" font-weight="600" fill="#64748b">Ghi nhớ</text>

        <text x="327" y="13" font-size="12" font-weight="700" fill="#ea580c" text-anchor="end">Quên mật khẩu?</text>
      </g>

      <!-- Nút Đăng nhập -->
      <g transform="translate(0, 195)">
        <rect width="327" height="46" rx="11" fill="url(#btnOrange)" />
        <text x="163" y="28" class="btn-text">ĐĂNG NHẬP →</text>
      </g>

      <!-- Chuyển sang Đăng ký -->
      <g transform="translate(163, 275)">
        <text x="0" y="0" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
          Chưa có tài khoản? <tspan font-weight="800" fill="#ea580c">Đăng ký</tspan>
        </text>
      </g>

      <!-- Note bảo mật -->
      <g transform="translate(163, 395)">
        <text x="0" y="0" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">
          🔒 Bảo mật chuẩn NVT Agency CRM
        </text>
      </g>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       CỘT 2: TAB ĐĂNG KÝ (ACTIVE - GỘP CHUNG VÀO 1 FORM)
       ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(460, 75)" filter="url(#cardShadow)">
    <rect width="375" height="725" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

    <!-- 1. THANH TAB CHUYỂN ĐỔI (SEGMENTED TABS) -->
    <g transform="translate(24, 20)">
      <rect width="327" height="40" rx="10" fill="#f1f5f9" />
      <!-- Tab Đăng nhập Inactive -->
      <text x="83" y="24" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">ĐĂNG NHẬP</text>
      <!-- Tab Đăng ký Active -->
      <rect x="164" y="3" width="160" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="244" y="24" font-size="11.5" font-weight="800" fill="#ea580c" text-anchor="middle">ĐĂNG KÝ</text>
    </g>

    <!-- 2. BRAND TITLE GỌN GÀNG -->
    <g transform="translate(187, 82)">
      <text x="0" y="16" class="hero-title">ĐĂNG KÝ TÀI KHOẢN NVT</text>
      <text x="0" y="32" class="hero-sub">TẠO TÀI KHOẢN ĐỂ TRUY CẬP HỆ THỐNG NỘI BỘ.</text>
    </g>

    <!-- 3. 6 TRƯỜNG NHẬP LIỆU ĐĂNG KÝ (CÂN XỨNG, ICON ĐẦY ĐỦ) -->
    <g transform="translate(24, 135)">
      
      <!-- Họ và tên -->
      <g transform="translate(0, 0)">
        <text x="0" y="9" class="input-label">HỌ VÀ TÊN</text>
        <rect x="0" y="14" width="327" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="12" y="39" font-size="13">👤</text>
        <text x="34" y="39" class="placeholder">Nhập họ và tên...</text>
      </g>

      <!-- ID Tài khoản Sale -->
      <g transform="translate(0, 68)">
        <text x="0" y="9" class="input-label">ID TÀI KHOẢN SALE</text>
        <rect x="0" y="14" width="327" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="12" y="39" font-size="13">🆔</text>
        <text x="34" y="39" class="placeholder">Nhập ID tài khoản SALE...</text>
      </g>

      <!-- Số điện thoại -->
      <g transform="translate(0, 136)">
        <text x="0" y="9" class="input-label">SỐ ĐIỆN THOẠI</text>
        <rect x="0" y="14" width="327" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="12" y="39" font-size="13">📞</text>
        <text x="34" y="39" class="placeholder">Nhập số điện thoại...</text>
      </g>

      <!-- Email Gmail -->
      <g transform="translate(0, 204)">
        <text x="0" y="9" class="input-label">EMAIL</text>
        <rect x="0" y="14" width="327" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="12" y="39" font-size="13">✉️</text>
        <text x="34" y="39" class="placeholder">Nhập Gmail...</text>
      </g>

      <!-- Mật khẩu -->
      <g transform="translate(0, 272)">
        <text x="0" y="9" class="input-label">MẬT KHẨU</text>
        <rect x="0" y="14" width="327" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="12" y="39" font-size="13">🔒</text>
        <text x="34" y="39" class="placeholder">Tối thiểu 8 ký tự</text>
        <text x="300" y="39" font-size="13">👁️</text>
      </g>

      <!-- Nhập lại mật khẩu -->
      <g transform="translate(0, 340)">
        <text x="0" y="9" class="input-label">NHẬP LẠI MẬT KHẨU</text>
        <rect x="0" y="14" width="327" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="12" y="39" font-size="13">🔐</text>
        <text x="34" y="39" class="placeholder">Xác nhận lại mật khẩu</text>
        <text x="300" y="39" font-size="13">👁️</text>
      </g>

      <!-- Nút Đăng ký tài khoản -->
      <g transform="translate(0, 410)">
        <rect width="327" height="46" rx="11" fill="url(#btnOrange)" />
        <text x="163" y="28" class="btn-text">ĐĂNG KÝ TÀI KHOẢN →</text>
      </g>

      <!-- Chuyển về Đăng nhập -->
      <g transform="translate(163, 485)">
        <text x="0" y="0" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
          Đã có tài khoản? <tspan font-weight="800" fill="#ea580c">Đăng nhập</tspan>
        </text>
      </g>

    </g>
  </g>
</svg>
