<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 760" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=Cinzel:wght@700;900&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      * { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .brand-title { font-family: 'Cinzel', serif; font-size: 19px; font-weight: 900; letter-spacing: 2px; fill: #0f172a; text-anchor: middle; }
      .slogan { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 800; letter-spacing: 2px; fill: #ea580c; text-anchor: middle; }
      .hero-title { font-size: 16px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .hero-sub { font-size: 10.5px; font-weight: 500; fill: #64748b; letter-spacing: 0.2px; text-anchor: middle; text-transform: uppercase; }
      .input-label { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; fill: #475569; }
      .placeholder { font-size: 12.5px; font-weight: 500; fill: #94a3b8; }
      .btn-text { font-size: 12.5px; font-weight: 800; letter-spacing: 1px; fill: #ffffff; text-anchor: middle; }
    </style>

    <!-- Aura nền cam sang trọng -->
    <radialGradient id="auraTop" cx="85%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auraBottom" cx="15%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Nút cam NVT Gradient -->
    <linearGradient id="btnOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Đổ bóng Modal điện thoại -->
    <filter id="mobileCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.08" />
    </filter>

    <filter id="btnShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ea580c" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- KHUNG MÀN HÌNH ĐIỆN THOẠI (MOBILE DEVICE FRAME) -->
  <rect width="440" height="760" fill="#fafaf9" />
  <rect width="440" height="760" fill="url(#auraTop)" />
  <rect width="440" height="760" fill="url(#auraBottom)" />

  <!-- STATUS BAR IPHONE (GIỜ + SÓNG + PIN) -->
  <text x="42" y="28" font-size="12" font-weight="700" fill="#0f172a">09:41</text>
  <g transform="translate(365, 18)">
    <!-- Wifi & Pin icon -->
    <path d="M0,8 A6,6 0 0,1 12,8 M2,10 A4,4 0 0,1 10,10 M5,12 A1,1 0 0,1 7,12" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <rect x="18" y="2" width="20" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <rect x="20" y="4" width="14" height="6" rx="1.5" fill="#0f172a" />
    <path d="M39,5 L39,9" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       CARD ĐĂNG NHẬP CHUẨN FORM NVT AGENCY (CÂN XỨNG, KHÔNG LỖI)
       ══════════════════════════════════════════════════════════════ -->
  <g transform="translate(34, 60)" filter="url(#mobileCardShadow)">
    
    <!-- Nền Card Trắng bo tròn 22px, viền xám nhẹ 1px (KHÔNG BỊ LỒNG 2 BORDER) -->
    <rect width="372" height="630" rx="22" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />

    <!-- 1. KHỐI BRANDING NVT AGENCY -->
    <g transform="translate(186, 36)">
      <!-- Logo NVT Icon Box -->
      <rect x="-24" y="0" width="48" height="48" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" />
      <circle cx="0" cy="24" r="17" fill="#fff7ed" />
      <text x="0" y="28" font-size="13" font-weight="900" fill="#ea580c" text-anchor="middle">NVT</text>

      <!-- Tiêu đề NVT AGENCY -->
      <text x="0" y="74" class="brand-title">NVT AGENCY</text>
      <!-- Slogan Cam -->
      <text x="0" y="90" class="slogan">ACADEMY · AFFILIATE · EDUCATION</text>

      <!-- Tiêu đề form -->
      <text x="0" y="122" class="hero-title">ĐĂNG NHẬP NVT AGENCY</text>
      <text x="0" y="140" class="hero-sub">ĐĂNG NHẬP ĐỂ TRUY CẬP HỆ THỐNG NỘI BỘ.</text>
    </g>

    <!-- 2. FORM FIELDS NHẬP LIỆU -->
    <g transform="translate(26, 210)">
      
      <!-- TRƯỜNG 1: SỐ ĐIỆN THOẠI HOẶC EMAIL -->
      <g transform="translate(0, 0)">
        <text x="0" y="10" class="input-label">SỐ ĐIỆN THOẠI HOẶC EMAIL</text>
        <rect x="0" y="18" width="320" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
        <!-- Mail Icon -->
        <g transform="translate(14, 33)">
          <rect width="18" height="14" rx="2.5" fill="none" stroke="#94a3b8" stroke-width="1.5" />
          <polyline points="1,2 9,8 17,2" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        </g>
        <text x="42" y="47" class="placeholder">Nhập số điện thoại hoặc email...</text>
      </g>

      <!-- TRƯỜNG 2: MẬT KHẨU -->
      <g transform="translate(0, 84)">
        <text x="0" y="10" class="input-label">MẬT KHẨU</text>
        <!-- Hộp có focus viền cam tinh tế -->
        <rect x="0" y="18" width="320" height="48" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
        <!-- Lock Icon -->
        <g transform="translate(14, 32)">
          <rect x="2" y="6" width="14" height="11" rx="2" fill="none" stroke="#ea580c" stroke-width="1.5" />
          <path d="M5,6 L5,4 A4,4 0 0,1 13,4 L13,6" fill="none" stroke="#ea580c" stroke-width="1.5" />
          <circle cx="9" cy="11" r="1.5" fill="#ea580c" />
        </g>
        <!-- Password bullets / text -->
        <text x="42" y="48" font-size="16" fill="#0f172a" letter-spacing="2">••••••••</text>
        <!-- Eye Icon Toggle bên phải -->
        <g transform="translate(286, 33)">
          <path d="M0,8 C4,2 14,2 18,8 C14,14 4,14 0,8 Z" fill="none" stroke="#94a3b8" stroke-width="1.5" />
          <circle cx="9" cy="8" r="3" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        </g>
      </g>

      <!-- 3. HÀNG GHI NHỚ & QUÊN MẬT KHẨU (NẰM NGANG 1 HÀNG CHUẨN, KHÔNG BỊ RỚT DÒNG, KHÔNG VIỀN OVAL) -->
      <g transform="translate(0, 168)">
        <!-- Bên trái: Checkbox + Chữ "Ghi nhớ" thẳng tắp -->
        <g transform="translate(0, 0)">
          <!-- Ô Checkbox cam tích sẵn -->
          <rect x="0" y="1" width="17" height="17" rx="4" fill="#ea580c" />
          <polyline points="4,9 7,12 13,5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Chữ Ghi nhớ nằm ngang hàng bên cạnh -->
          <text x="25" y="14" font-size="12.5" font-weight="600" fill="#64748b">Ghi nhớ</text>
        </g>

        <!-- Bên phải: Link "Quên mật khẩu?" màu cam thanh lịch (TUYỆT ĐỐI KHÔNG VIỀN OVAL) -->
        <text x="320" y="14" font-size="12.5" font-weight="700" fill="#ea580c" text-anchor="end">Quên mật khẩu?</text>
      </g>

      <!-- 4. NÚT ĐĂNG NHẬP (CAM NVT BÓNG BẨY) -->
      <g transform="translate(0, 206)">
        <rect width="320" height="48" rx="12" fill="url(#btnOrange)" filter="url(#btnShadow)" />
        <g transform="translate(160, 29)">
          <text x="-10" y="0" class="btn-text">ĐĂNG NHẬP</text>
          <!-- Mũi tên -->
          <line x1="42" y1="-4" x2="54" y2="-4" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
          <polyline points="49,-9 54,-4 49,1" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </g>

      <!-- 5. FOOTER CHUYỂN TAB (ĐĂNG KÝ KHÔNG CÓ VIỀN OVAL) -->
      <g transform="translate(160, 286)">
        <text x="0" y="0" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">
          Chưa có tài khoản? <tspan font-weight="800" fill="#ea580c">Đăng ký</tspan>
        </text>
      </g>

      <!-- Khối bảo mật phụ dưới cùng -->
      <g transform="translate(160, 340)">
        <text x="0" y="0" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">
          🔒 Kết nối SSL 256-bit an toàn · NVT Agency CRM
        </text>
      </g>

    </g>

  </g>

  <!-- HOME INDICATOR (THANH GẠCH DƯỚI ĐÁY IPHONE) -->
  <rect x="155" y="744" width="130" height="4.5" rx="2.5" fill="#0f172a" opacity="0.4" />
</svg>
