<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Hợp Nhất Đăng Nhập & Đăng Ký Mobile - NVT Agency CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --nvt-orange: #ea580c;
      --nvt-orange-light: #f97316;
      --nvt-orange-glow: rgba(234, 88, 12, 0.16);
      --nvt-text-dark: #0f172a;
      --nvt-text-muted: #64748b;
      --nvt-border: #e2e8f0;
      --nvt-bg-input: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .demo-instructions {
      max-width: 440px;
      text-align: center;
      margin-bottom: 20px;
    }
    .demo-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(234, 88, 12, 0.15);
      border: 1px solid rgba(234, 88, 12, 0.4);
      color: #fdba74;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .demo-instructions h1 {
      font-size: 21px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .demo-instructions p {
      font-size: 13px;
      color: #94a3b8;
    }

    /* KHUNG MÔ PHỎNG ĐIỆN THOẠI (SMARTPHONE FRAME) */
    .mobile-phone-device {
      width: 100%;
      max-width: 400px;
      background: #fafaf9;
      border-radius: 36px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 0 10px #1e293b;
      position: relative;
      overflow: hidden;
      padding: 24px 16px 30px;
      color: var(--nvt-text-dark);
    }

    /* Aura nền cam nhẹ chuẩn NVT */
    .mobile-phone-device::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 85% 10%, rgba(249, 115, 22, 0.14) 0%, transparent 55%),
        radial-gradient(circle at 10% 90%, rgba(234, 88, 12, 0.1) 0%, transparent 60%),
        linear-gradient(180deg, #fafaf9 0%, #ffffff 40%, #fff7ed 100%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-card-inner {
      position: relative;
      z-index: 10;
      background: #ffffff;
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 24px;
      padding: 22px 18px 24px;
      box-shadow: 0 16px 36px -10px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(15, 23, 42, 0.03);
    }

    /* THANH TAB CHUYỂN ĐỔI SEGMENTED TABS */
    .auth-segmented-tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 9px 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--nvt-text-muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      text-align: center;
    }
    .tab-btn.active {
      background: #ffffff;
      color: var(--nvt-orange);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* 1. BRAND HERO */
    .brand-hero {
      text-align: center;
      margin-bottom: 18px;
    }
    .brand-logo-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #ffffff;
      border: 1.5px solid #fed7aa;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.15);
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--nvt-orange);
      font-weight: 900;
      font-size: 12px;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.16em;
      color: var(--nvt-text-dark);
      margin-bottom: 2px;
    }
    .brand-slogan {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: var(--nvt-orange);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hero-form-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--nvt-text-dark);
      text-transform: uppercase;
    }
    .hero-form-sub {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--nvt-text-muted);
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* 2. FORM & INPUTS (RESET TOÀN BỘ KHUNG VIỀN LỒNG NHAU) */
    form {
      display: flex !important;
      flex-direction: column !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      box-shadow: none !important;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: left;
    }
    .input-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #475569;
      text-transform: uppercase;
    }
    .input-box {
      height: 44px;
      border: 1px solid var(--nvt-border);
      border-radius: 11px;
      background: var(--nvt-bg-input);
      display: flex;
      align-items: center;
      padding: 0 13px;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .input-box:focus-within {
      background: #ffffff;
      border-color: var(--nvt-orange);
      box-shadow: 0 0 0 3px var(--nvt-orange-glow);
    }
    .input-icon {
      font-size: 13px;
      color: #94a3b8;
      flex-shrink: 0;
    }
    .input-box:focus-within .input-icon {
      color: var(--nvt-orange);
    }
    .native-input {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--nvt-text-dark);
      font-family: inherit;
    }
    .native-input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }
    .btn-eye-toggle {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-eye-toggle:hover {
      color: var(--nvt-orange);
    }

    /* 3. HÀNG GHI NHỚ & QUÊN MẬT KHẨU (CHUẨN 1 HÀNG) */
    .row-meta-actions {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: space-between !important;
      margin: 2px 0 !important;
    }
    .remember-label {
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 7px !important;
      color: var(--nvt-text-muted) !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      cursor: pointer !important;
      user-select: none !important;
      white-space: nowrap !important;
      text-transform: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .remember-label input[type="checkbox"] {
      width: 16px !important;
      height: 16px !important;
      min-height: 16px !important;
      flex: 0 0 16px !important;
      accent-color: var(--nvt-orange) !important;
      cursor: pointer !important;
      margin: 0 !important;
    }

    /* Quên mật khẩu: Link sạch sẽ, KHÔNG CÓ VIỀN OVAL */
    .forgot-link-clean {
      border: none !important;
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
      color: var(--nvt-orange) !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      font-family: inherit !important;
      text-decoration: none !important;
      cursor: pointer !important;
      outline: none !important;
      box-shadow: none !important;
      line-height: 1 !important;
    }
    .forgot-link-clean:hover {
      text-decoration: underline !important;
      color: #c2410c !important;
    }

    /* 4. NÚT SUBMIT CAM CHUẨN */
    .btn-submit-orange {
      width: 100%;
      height: 46px;
      border-radius: 11px;
      border: none;
      background: linear-gradient(135deg, var(--nvt-orange) 0%, var(--nvt-orange-light) 100%);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: 0 4px 16px rgba(234, 88, 12, 0.35);
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-submit-orange:hover {
      background: linear-gradient(135deg, #c2410c 0%, var(--nvt-orange) 100%);
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.45);
      transform: translateY(-1px);
    }
    .btn-submit-orange:active {
      transform: scale(0.985);
    }

    /* 5. FOOTER CHUYỂN FORM (KHÔNG CÓ VIỀN OVAL) */
    .footer-switch {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: var(--nvt-text-muted);
    }
    .switch-link-clean {
      border: none !important;
      background: transparent !important;
      padding: 0 !important;
      margin: 0 0 0 4px !important;
      color: var(--nvt-orange) !important;
      font-size: 12px !important;
      font-weight: 800 !important;
      font-family: inherit !important;
      text-decoration: none !important;
      cursor: pointer !important;
      outline: none !important;
      box-shadow: none !important;
      display: inline-block !important;
    }
    .switch-link-clean:hover {
      text-decoration: underline !important;
      color: #c2410c !important;
    }
  </style>
</head>
<body>

  <div class="demo-instructions">
    <div class="demo-tag">✨ GIAO DIỆN HỢP NHẤT 2-TRONG-1</div>
    <h1>Đăng Nhập & Đăng Ký Mobile NVT</h1>
    <p>Chuyển đổi tức thì qua thanh Tab hoặc nút bấm ở chân trang</p>
  </div>

  <!-- THIẾT BỊ MÔ PHỎNG MOBILE -->
  <div class="mobile-phone-device">
    
    <div class="auth-card-inner">
      
      <!-- 1. THANH TAB CHUYỂN ĐỔI ĐĂNG NHẬP ⟷ ĐĂNG KÝ -->
      <div class="auth-segmented-tabs">
        <button type="button" class="tab-btn active" id="tabLoginBtn" onclick="switchAuthMode('login')">ĐĂNG NHẬP</button>
        <button type="button" class="tab-btn" id="tabRegisterBtn" onclick="switchAuthMode('register')">ĐĂNG KÝ</button>
      </div>

      <!-- 2. BRAND HERO -->
      <div class="brand-hero">
        <div class="brand-logo-box">NVT</div>
        <div class="brand-title">NVT AGENCY</div>
        <div class="brand-slogan">ACADEMY · AFFILIATE · EDUCATION</div>
        <div class="hero-form-title" id="heroFormTitle">ĐĂNG NHẬP NVT AGENCY</div>
        <div class="hero-form-sub" id="heroFormSub">Đăng nhập để truy cập hệ thống nội bộ.</div>
      </div>

      <!-- ══════════════════════════════════════════
           FORM 1: ĐĂNG NHẬP (MẶC ĐỊNH HIỂN THỊ)
           ══════════════════════════════════════════ -->
      <form id="loginForm" onsubmit="event.preventDefault(); alert('Đăng nhập thành công!');">
        <!-- Field 1: SĐT hoặc Email -->
        <div class="form-group">
          <label class="input-label" for="loginPhone">SỐ ĐIỆN THOẠI HOẶC EMAIL</label>
          <div class="input-box">
            <span class="input-icon">✉️</span>
            <input type="text" id="loginPhone" class="native-input" placeholder="Nhập số điện thoại hoặc email..." value="0900000013">
          </div>
        </div>

        <!-- Field 2: Mật khẩu -->
        <div class="form-group">
          <label class="input-label" for="loginPass">MẬT KHẨU</label>
          <div class="input-box">
            <span class="input-icon">🔒</span>
            <input type="password" id="loginPass" class="native-input" placeholder="Nhập mật khẩu" value="12345678">
            <button type="button" class="btn-eye-toggle" title="Ẩn/hiện mật khẩu" onclick="const p=document.getElementById('loginPass'); p.type = p.type==='password'?'text':'password';">👁️</button>
          </div>
        </div>

        <!-- Row Ghi nhớ & Quên mật khẩu -->
        <div class="row-meta-actions">
          <label class="remember-label">
            <input type="checkbox" checked>
            <span>Ghi nhớ</span>
          </label>
          <button type="button" class="forgot-link-clean" onclick="alert('Mở chức năng lấy lại mật khẩu');">Quên mật khẩu?</button>
        </div>

        <!-- Nút Đăng nhập -->
        <button type="submit" class="btn-submit-orange">
          <span>ĐĂNG NHẬP</span>
          <span style="font-size: 14px;">→</span>
        </button>

        <!-- Chân trang -->
        <div class="footer-switch">
          <span>Chưa có tài khoản?</span>
          <button type="button" class="switch-link-clean" onclick="switchAuthMode('register');">Đăng ký</button>
        </div>
      </form>

      <!-- ══════════════════════════════════════════
           FORM 2: ĐĂNG KÝ (ẨN MẶC ĐỊNH, CHUYỂN KHI BẤM TAB)
           ══════════════════════════════════════════ -->
      <form id="registerForm" style="display: none;" onsubmit="event.preventDefault(); alert('Đăng ký tài khoản thành công!');">
        
        <!-- Field 1: Họ và tên -->
        <div class="form-group">
          <label class="input-label" for="regName">HỌ VÀ TÊN</label>
          <div class="input-box">
            <span class="input-icon">👤</span>
            <input type="text" id="regName" class="native-input" placeholder="Nhập họ và tên...">
          </div>
        </div>

        <!-- Field 2: ID tài khoản SALE -->
        <div class="form-group">
          <label class="input-label" for="regAccountId">ID TÀI KHOẢN SALE</label>
          <div class="input-box">
            <span class="input-icon">🆔</span>
            <input type="text" id="regAccountId" class="native-input" placeholder="Nhập ID tài khoản SALE...">
          </div>
        </div>

        <!-- Field 3: Số điện thoại -->
        <div class="form-group">
          <label class="input-label" for="regPhone">SỐ ĐIỆN THOẠI</label>
          <div class="input-box">
            <span class="input-icon">📞</span>
            <input type="tel" id="regPhone" class="native-input" placeholder="Nhập số điện thoại...">
          </div>
        </div>

        <!-- Field 4: Email Gmail -->
        <div class="form-group">
          <label class="input-label" for="regEmail">EMAIL</label>
          <div class="input-box">
            <span class="input-icon">✉️</span>
            <input type="email" id="regEmail" class="native-input" placeholder="Nhập Gmail...">
          </div>
        </div>

        <!-- Field 5: Mật khẩu -->
        <div class="form-group">
          <label class="input-label" for="regPass">MẬT KHẨU</label>
          <div class="input-box">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPass" class="native-input" placeholder="Tối thiểu 8 ký tự">
            <button type="button" class="btn-eye-toggle" title="Ẩn/hiện mật khẩu" onclick="const p=document.getElementById('regPass'); p.type = p.type==='password'?'text':'password';">👁️</button>
          </div>
        </div>

        <!-- Field 6: Nhập lại mật khẩu -->
        <div class="form-group">
          <label class="input-label" for="regPassConfirm">NHẬP LẠI MẬT KHẨU</label>
          <div class="input-box">
            <span class="input-icon">🔐</span>
            <input type="password" id="regPassConfirm" class="native-input" placeholder="Xác nhận lại mật khẩu">
            <button type="button" class="btn-eye-toggle" title="Ẩn/hiện mật khẩu" onclick="const p=document.getElementById('regPassConfirm'); p.type = p.type==='password'?'text':'password';">👁️</button>
          </div>
        </div>

        <!-- Nút Đăng ký -->
        <button type="submit" class="btn-submit-orange">
          <span>ĐĂNG KÝ TÀI KHOẢN</span>
          <span style="font-size: 14px;">→</span>
        </button>

        <!-- Chân trang chuyển về Đăng nhập -->
        <div class="footer-switch">
          <span>Đã có tài khoản?</span>
          <button type="button" class="switch-link-clean" onclick="switchAuthMode('login');">Đăng nhập</button>
        </div>
      </form>

    </div>

  </div>

  <script>
    function switchAuthMode(mode) {
      const isLogin = mode === 'login';
      document.getElementById('tabLoginBtn').classList.toggle('active', isLogin);
      document.getElementById('tabRegisterBtn').classList.toggle('active', !isLogin);
      
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      
      loginForm.style.setProperty('display', isLogin ? 'flex' : 'none', 'important');
      registerForm.style.setProperty('display', isLogin ? 'none' : 'flex', 'important');
      
      document.getElementById('heroFormTitle').textContent = isLogin ? 'ĐĂNG NHẬP NVT AGENCY' : 'ĐĂNG KÝ TÀI KHOẢN NVT';
      document.getElementById('heroFormSub').textContent = isLogin ? 'Đăng nhập để truy cập hệ thống nội bộ.' : 'Tạo tài khoản để truy cập hệ thống nội bộ.';
    }
  </script>

</body>
</html>
